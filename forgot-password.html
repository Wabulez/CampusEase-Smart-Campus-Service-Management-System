<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CampusEase - Forgot Password</title>
    
    <!-- External Font and Icon Libraries -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- Link to external CSS file -->
    <link rel="stylesheet" href="css/forgot-styles.css">
</head>
<body>

    <!-- Main Branding -->
    <h2 class="logo">
        <i class="fa-solid fa-building-columns"></i>
        CampusEase
    </h2>

    <div class="forgot-container">
        <form action="login.html">
            <div class="icon-header">
                <i class="fa-solid fa-unlock-keyhole"></i>
            </div>
            <h1>Reset Password</h1>
            <span>Enter your university email address and we'll send you a link to securely reset your password.</span>
            
            <input type="email" placeholder="University Email" required />
            
            <!-- In a real app, this would trigger a backend function. Here it redirects for visual testing -->
            <button type="button" onclick="alert('Reset link sent to your email!'); window.location.href='login.html'">Send Reset Link</button>
            
            <a href="login.html" class="back-link">
                <i class="fa-solid fa-arrow-left"></i> Back to Sign In
            </a>
        </form>
    </div>

</body>
</html>
